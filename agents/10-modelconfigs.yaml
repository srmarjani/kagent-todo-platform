apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata:
  name: sonnet-via-gateway
  namespace: kagent
spec:
  apiKeySecret: kagent-gateway-dummy        # fake key; the gateway swaps in the real one
  apiKeySecretKey: API_KEY
  model: anthropic/claude-sonnet-5.5        # must match the AgentgatewayModel's match.model
  provider: OpenAI
  stream: true
  openAI:
    baseUrl: http://ai-gateway.agentgateway-system.svc.cluster.local/v1
