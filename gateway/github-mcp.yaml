apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: github-mcp
  namespace: agentgateway-system
spec:
  mcp:
    targets:
    - name: github                     # one target, so tool names get no prefix
      static:
        host: api.githubcopilot.com
        port: 443
        path: /mcp/                    # GitHub's endpoint; clients use the route path below
        protocol: StreamableHTTP
        policies:
          tls:
            sni: api.githubcopilot.com # setting tls turns on HTTPS to the target
          auth:
            secretRef:
              name: github-mcp-secret  # key "Authorization", raw PAT; gateway adds "Bearer "
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: github-mcp
  namespace: agentgateway-system
spec:
  parentRefs:
  - name: ai-gateway
    sectionName: http
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /github-mcp
    filters:
    - type: RequestHeaderModifier      # the gateway, not kagent, picks the GitHub toolsets
      requestHeaderModifier:
        set:
        - name: X-MCP-Toolsets
          value: repos,issues,pull_requests
        - name: X-MCP-Features         # write tools act directly; kagent's requireApproval is the gate
          value: mcp_apps_disable_form_deferral
    backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: github-mcp
